<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Proxima Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/themes/vue.css">
  <link rel="icon" href="static/img/proxima-centaur-min-onlight.svg">
  <style>
    /* Sidebar masthead: the logo lockup carries the name, so the docsify site
       name is reduced to the word that qualifies it. */
    .app-name-link .brand { display: block; width: 200px; max-width: 100%; height: auto; margin: 0 auto 2px; }
    .app-name-link .brand-sub {
      display: block; font-size: 14px; font-weight: 400; color: #7f8c98;
      letter-spacing: 0.09em; text-transform: uppercase;
    }
    body {
      font-size: 18px;
    }
    .content {
      font-size: 18px;
    }
    .sidebar {
      font-size: 18px;
    }
  </style>
</head>
<body>
  <div id="app">Loading…</div>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']]
      },
      svg: {
        fontCache: 'global'
      }
    };

    window.$docsify = {
      name: '<img class="brand" src="static/img/proxima-lockup-onlight.svg" alt="Proxima">'
          + '<span class="brand-sub">documents</span>',
      loadSidebar: true,
      subMaxLevel: 3,
      afterEach: function () {
        if (window.MathJax && window.MathJax.typesetPromise) {
          window.MathJax.typesetPromise();
        }
      }
    };
  </script>

  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-latex@0"></script>
</body>
</html>
